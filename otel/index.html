<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c14;--fg:#c8d3e0;--gold:#b8933a;--btn:#141c2a;color-scheme:dark}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--fg);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{font:16px "Pixelify Sans","Courier New",monospace}
#c{position:absolute;image-rendering:pixelated;image-rendering:crisp-edges;background:#000}
.tc{display:none;position:absolute}
body.touch .tc{display:flex}
#dpad{width:150px;height:150px;border-radius:50%;background:var(--btn);border:2px solid #2a3548;
  align-items:center;justify-content:center;touch-action:none}
#dpad span{position:absolute;color:#6c7a90;font-size:22px;pointer-events:none}
#dpad .u{top:8px}#dpad .d{bottom:8px}#dpad .l{left:14px}#dpad .r{right:14px}
#ab{flex-direction:column;gap:18px;align-items:center}
.b{font:700 18px "Pixelify Sans","Courier New",monospace;color:var(--fg);background:var(--btn);
  border:2px solid var(--gold);touch-action:none;padding:0}
#ab .b{width:78px;height:78px;border-radius:50%}
#ab .b.ok{border-color:#4a9e6a}#ab .b.no{border-color:#b85555}
#top{gap:10px}
#top .b{font-size:15px;height:38px;padding:0 14px;border-radius:8px;border-color:#2a3548}
body.land #dpad{left:calc(8px + env(safe-area-inset-left,0px));top:calc(50% - 75px)}
body.land #ab{right:calc(32px + env(safe-area-inset-right,0px));top:calc(50% - 60px)}
body.land #top{right:calc(10px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px))}
body.port #dpad{left:20px;bottom:calc(40px + env(safe-area-inset-bottom,0px))}
body.port #ab{flex-direction:row;right:20px;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
body.port #top{right:16px;top:calc(10px + env(safe-area-inset-top,0px))}
</style>
<canvas id="c"></canvas>
<div id="dpad" class="tc"><span class="u">▲</span><span class="d">▼</span><span class="l">◀</span><span class="r">▶</span></div>
<div id="ab" class="tc"><button class="b no" data-a="back">Нет</button><button class="b ok" data-a="ok">Да</button></div>
<div id="top" class="tc"><button class="b" data-a="menu">Меню</button><button class="b" data-a="mute">Звук</button></div>
<script>
'use strict';
// ---------- экран ----------
const F='"Pixelify Sans","Courier New",monospace';
const C={g:'#4a9e6a',b:'#4a7eaa',v:'#7a67b8',y:'#b8933a',r:'#b85555',bg:'#080c14',t:'#c8d3e0'};
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let SC=1,touch=matchMedia('(pointer:coarse)').matches;
function layout(){
  const W=innerWidth,H=innerHeight,land=W>H;
  document.body.classList.toggle('land',land);document.body.classList.toggle('port',!land);
  let aw=W,ah=H,top=0;
  if(touch){if(land)aw=W-320;else{top=56;ah=H-56-250}}
  const s=Math.max(.1,Math.min(aw/640,ah/480)),cw=Math.floor(640*s),ch=Math.floor(480*s);
  cvs.style.width=cw+'px';cvs.style.height=ch+'px';
  cvs.style.left=Math.floor((W-cw)/2)+'px';
  cvs.style.top=Math.floor(touch&&!land?top+(ah-ch)/2:(H-ch)/2)+'px';
  const dpr=Math.min(2,devicePixelRatio||1);
  cvs.width=Math.max(1,Math.round(cw*dpr));cvs.height=Math.max(1,Math.round(ch*dpr));
  SC=cvs.width/640;
}
function setTouch(v){if(touch===v)return;touch=v;document.body.classList.toggle('touch',v);layout()}
document.body.classList.toggle('touch',touch);
addEventListener('resize',layout);layout();

// ---------- управление ----------
const held={up:0,down:0,left:0,right:0};let pressQ=[],P=new Set();
const KEYS={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',
  ArrowRight:'right',KeyD:'right',KeyZ:'ok',Enter:'ok',Space:'ok',KeyX:'back',ShiftLeft:'back',
  ShiftRight:'back',Escape:'back',Backspace:'back',KeyC:'menu',KeyM:'mute'};
addEventListener('keydown',e=>{const a=KEYS[e.code];if(!a)return;e.preventDefault();audio();
  if(a in held){if(!held[a])pressQ.push(a);held[a]=1}else if(!e.repeat)pressQ.push(a)});
addEventListener('keyup',e=>{const a=KEYS[e.code];if(a in held)held[a]=0});
addEventListener('blur',()=>{for(const k in held)held[k]=0});
function take(a){if(P.has(a)){P.delete(a);return true}return false}
const dpad=document.getElementById('dpad');
function dp(e){const r=dpad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
  const n={up:0,down:0,left:0,right:0};
  if(Math.hypot(dx,dy)>14){const a=Math.atan2(dy,dx),c=Math.cos(a),s=Math.sin(a);
    if(c>.38)n.right=1;if(c<-.38)n.left=1;if(s>.38)n.down=1;if(s<-.38)n.up=1}
  for(const k in n){if(n[k]&&!held[k])pressQ.push(k);held[k]=n[k]}}
dpad.addEventListener('pointerdown',e=>{e.preventDefault();audio();dpad.setPointerCapture(e.pointerId);dp(e)});
dpad.addEventListener('pointermove',e=>{if(dpad.hasPointerCapture(e.pointerId))dp(e)});
for(const ev of['pointerup','pointercancel','lostpointercapture'])dpad.addEventListener(ev,()=>{for(const k in held)held[k]=0});
for(const b of document.querySelectorAll('[data-a]'))b.addEventListener('pointerdown',e=>{e.preventDefault();audio();pressQ.push(b.dataset.a)});
addEventListener('touchstart',()=>setTouch(true),{passive:true});
addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')setTouch(false)});
cvs.addEventListener('pointerdown',()=>{audio();if(scene==='title'||scene==='intro'||scene==='over'||scene==='ending')pressQ.push('ok')});
addEventListener('touchend',()=>audio(),{passive:true});addEventListener('click',()=>audio());
addEventListener('contextmenu',e=>e.preventDefault());

// ---------- звук ----------
let AC=null,master=null,muted=false,noiseBuf=null,audioWarned=false;
function audio(){
  if(AC){if(AC.state==='suspended')AC.resume().catch(e=>console.warn('Звук не включился:',e));return}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){console.warn('Звук недоступен:',e);AC=null;master=null}
}
function tone(f,d,type='square',v=.12,t0=0,slide=0){if(!AC)return;const t=AC.currentTime+Math.max(0,t0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
function noise(d,v=.15,t0=0,f=1200){if(!AC)return;const t=AC.currentTime+t0,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;fl.type='lowpass';fl.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+d+.03)}
const SFX={
  blip:()=>tone(560,.035,'square',.035),voice:()=>tone(180+Math.random()*40,.05,'square',.05),
  move:()=>tone(700,.04,'square',.05),select:()=>{tone(660,.06,'square',.07);tone(990,.08,'square',.06,.05)},
  back:()=>tone(330,.07,'square',.06),hurt:()=>{tone(220,.18,'sawtooth',.14,0,90);noise(.15,.12)},
  slash:()=>noise(.25,.2,0,3000),hit:()=>{tone(140,.2,'square',.15,0,60);noise(.12,.15)},
  door:()=>{noise(.3,.12,0,500);tone(110,.25,'triangle',.12,0,70)},item:()=>{tone(523,.08,'square',.07);tone(784,.14,'square',.07,.08)},
  heal:()=>{tone(523,.1,'triangle',.12);tone(659,.1,'triangle',.12,.08);tone(1046,.2,'triangle',.12,.16)},
  alert:()=>{tone(880,.08,'square',.1);tone(880,.08,'square',.1,.12)},bell:()=>{tone(392,1.4,'sine',.2);tone(784,1,'sine',.08)},
  spare:()=>{tone(392,.1,'square',.08);tone(523,.1,'square',.08,.1);tone(784,.25,'square',.08,.2)},
  dust:()=>noise(.8,.18,0,800),shatter:()=>{tone(300,.3,'square',.15,0,80);noise(.4,.15,.05,2000)},
  save:()=>{tone(440,.15,'triangle',.12);tone(660,.3,'triangle',.12,.12)},rush:()=>{noise(1.2,.3,0,400);tone(60,1.1,'sawtooth',.18,0,40)},
  flick:()=>noise(.05,.08,0,4000),beam:()=>tone(1200,.3,'sawtooth',.06,0,300),lock:()=>tone(150,.1,'square',.1)
};
function sfx(n){if(!AC||muted)return;try{SFX[n]()}catch(e){if(!audioWarned){audioWarned=true;console.warn('Ошибка звука:',e)}}}
const mtof=m=>440*Math.pow(2,(m-69)/12);
const THEMES={
  title:{bpm:70,bass:[38,0,0,0,38,0,0,0,41,0,0,0,37,0,0,0],lead:[0,0,62,0,0,0,61,0,0,0,65,0,64,0,0,0]},
  hotel:{bpm:84,bass:[45,0,52,0,45,0,52,0,43,0,50,0,44,0,52,0],lead:[69,0,0,72,0,71,0,0,67,0,0,0,68,0,0,0]},
  battle:{bpm:150,bass:[40,40,52,40,40,52,43,45,40,40,52,40,47,46,45,43],lead:[64,0,67,0,71,0,70,0,64,0,67,0,62,0,63,0]},
  boss:{bpm:130,bass:[36,36,48,36,39,39,51,39,34,34,46,34,35,35,47,35],lead:[72,0,75,0,79,0,78,75,70,0,74,0,71,0,74,0]},
  void:{bpm:96,bass:[33,0,33,0,32,0,32,0,31,0,31,0,32,0,0,0],lead:[69,0,0,68,0,0,64,0,0,0,63,0,0,64,0,0]}
};
let music=null,mStep=0,mNext=0;
function playMusic(n){if(music===n)return;music=n;mStep=0;mNext=0}
function musicTick(){if(!AC||!music||muted)return;const th=THEMES[music],sp=60/th.bpm/2;
  if(mNext<AC.currentTime-.2)mNext=AC.currentTime+.05;
  while(mNext<AC.currentTime+.15){const i=mStep%16,b=th.bass[i],l=th.lead[i],t0=mNext-AC.currentTime;
    if(b)tone(mtof(b),sp*.9,'triangle',.09,t0);if(l)tone(mtof(l),sp*.8,'square',.03,t0);mStep++;mNext+=sp}}
function toggleMute(){muted=!muted;if(master)master.gain.value=muted?0:.5;toast(muted?'Звук выключен':'Звук включён')}

// ---------- мелочи ----------
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const clone=o=>JSON.parse(JSON.stringify(o));
function R(x,c,X,Y,W,H){x.fillStyle=c;x.fillRect(X,Y,W,H)}
function E(x,c,cx,cy,rx,ry){x.fillStyle=c;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fill()}
function Pg(x,c,pts){x.fillStyle=c;x.beginPath();x.moveTo(pts[0],pts[1]);for(let i=2;i<pts.length;i+=2)x.lineTo(pts[i],pts[i+1]);x.closePath();x.fill()}
// спрайт: рисуем, порог прозрачности, обводка в 1 пиксель
function spr(w,h,draw,ol='#000'){
  const c=document.createElement('canvas');c.width=w+2;c.height=h+2;const x=c.getContext('2d');
  x.translate(1,1);draw(x);const d=x.getImageData(0,0,w+2,h+2),a=d.data,W=w+2;
  for(let i=3;i<a.length;i+=4)a[i]=a[i]>100?255:0;
  if(ol){const r=parseInt(ol.slice(1,3),16),g=parseInt(ol.slice(3,5),16),b=parseInt(ol.slice(5,7),16),src=new Uint8ClampedArray(a);
    for(let y=0;y<h+2;y++)for(let X=0;X<W;X++){const i=(y*W+X)*4;if(src[i+3])continue;
      if((X>0&&src[i-1])||(X<W-1&&src[i+7])||(y>0&&src[i-W*4+3])||(y<h+1&&src[i+W*4+3])){a[i]=r;a[i+1]=g;a[i+2]=b;a[i+3]=255}}}
  x.setTransform(1,0,0,1,0,0);x.putImageData(d,0,0);return c}
function wrapText(t,w,font){ctx.font=font;const out=[];
  for(const para of t.split('\n')){const lines=[];let line='';
    for(const wd of para.split(' ')){const test=line?line+' '+wd:wd;
      if(line&&ctx.measureText(test).width>w){lines.push(line);line='  '+wd}else line=test}
    lines.push(line);out.push(lines)}return out}
// печатающийся текст
function typer(text,o={}){const font=o.font||'22px '+F,pages=[];
  for(const ls of wrapText(text,o.w||540,font))for(let i=0;i<ls.length;i+=3)pages.push(ls.slice(i,i+3));
  return{pages,font,pi:0,n:0,done:false,cb:o.cb,lh:o.lh||30,snd:o.snd||'blip',col:o.col||C.t}}
const tLen=t=>t.pages[t.pi].join('').length,tFull=t=>t.n>=tLen(t);
function tUpd(t,dt){if(t.done||tFull(t))return;const p=Math.floor(t.n/2);t.n=Math.min(tLen(t),t.n+dt*48);if(Math.floor(t.n/2)>p)sfx(t.snd)}
function tOk(t){if(t.done)return;if(!tFull(t)){t.n=1e9;return}if(t.pi<t.pages.length-1){t.pi++;t.n=0}else{t.done=true;if(t.cb)t.cb()}}
function tDraw(t,x,y){ctx.font=t.font;ctx.fillStyle=t.col;ctx.textBaseline='top';let left=Math.floor(t.n);const pg=t.pages[t.pi];
  for(let i=0;i<pg.length;i++){if(left>0)ctx.fillText(pg[i].slice(0,left),x,y+i*t.lh);left-=pg[i].length}}
function txt(s,x,y,size,col=C.t,align='left',bold=false){ctx.font=(bold?'700 ':'')+size+'px '+F;ctx.fillStyle=col;ctx.textAlign=align;ctx.textBaseline='top';ctx.fillText(s,x,y);ctx.textAlign='left'}
let toastT=0,toastMsg='';function toast(m,t=2.2){toastMsg=m;toastT=t}

// ---------- сохранение ----------
const SKEY='otel-pustoty-2d';let S=null,CK=null;
function newState(){return{room:0,hp:20,maxHp:20,items:[],keys:0,flags:{k4:Math.floor(Math.random()*3)},spared:[],killed:[]}}
function saveCK(){CK=clone(S);try{localStorage.setItem(SKEY,JSON.stringify(CK))}catch(e){console.warn('Не удалось сохранить игру:',e);toast('Сохранить не вышло: браузер запретил')}}
function loadSave(){let raw=null;try{raw=localStorage.getItem(SKEY)}catch(e){console.warn('Хранилище недоступно:',e);return null}
  if(!raw)return null;
  try{const s=JSON.parse(raw);if(s&&Number.isInteger(s.room)&&s.room>=0&&s.room<ROOMS.length&&Array.isArray(s.items)&&s.items.every(i=>i in ITEMS)
    &&s.flags&&typeof s.flags==='object'&&[0,1,2].includes(s.flags.k4)&&Array.isArray(s.spared)&&Array.isArray(s.killed)&&s.maxHp>0&&s.hp>0&&Number.isInteger(s.keys))return s}
  catch(e){}console.warn('Сохранение повреждено, начинаем заново');return null}
function clearSave(){try{localStorage.removeItem(SKEY)}catch(e){console.warn('Не удалось стереть сохранение:',e)}}
const ITEMS={'Бинт':10,'Витамины':15};
// ---------- спрайты ----------
function kidSpr(dir,f){return spr(16,24,x=>{
  const sk='#d8b89a',hr='#3a2a20',sh='#4a7eaa',sl='#5a90bf',pn='#2a3448',bt='#1a1a22',lo=f===0?-1:f===2?1:0;
  if(dir===3){x.translate(16,0);x.scale(-1,1);dir=2}
  R(x,pn,4,18,3,5+lo);R(x,pn,9,18,3,5-lo);R(x,bt,4,22+lo,3,2);R(x,bt,9,22-lo,3,2);
  R(x,sh,3,11,10,8);R(x,sl,3,14,10,1);
  if(dir<2){R(x,sh,1,11,2,5);R(x,sh,13,11,2,5);R(x,sk,1,16,2,2);R(x,sk,13,16,2,2)}
  else{R(x,sh,6,12,3,5);R(x,sk,6,17,3,2)}
  E(x,sk,8,6,5,5.5);
  if(dir===0){R(x,hr,3,0,10,4);R(x,hr,3,2,2,5);R(x,hr,11,2,2,5);R(x,'#1a1418',5,6,1,2);R(x,'#1a1418',10,6,1,2)}
  else if(dir===1){E(x,hr,8,5,5,5.5);R(x,hr,3,4,10,5)}
  else{R(x,hr,3,0,10,4);R(x,hr,8,2,5,7);R(x,'#1a1418',4,6,1,2)}
})}
const KID=[0,1,2,3].map(d=>[0,1,2].map(f=>kidSpr(d,f)));
const SP={
shadow:spr(30,42,x=>{Pg(x,'#140f20',[15,0,27,10,29,24,24,34,28,42,18,37,13,42,8,36,2,40,4,28,1,14,6,4]);E(x,'#221a33',15,16,9,10);
  E(x,C.t,10,15,2.5,3.5);E(x,C.t,20,15,2.5,3.5);R(x,C.bg,10,15,1,2);R(x,C.bg,20,15,1,2);Pg(x,C.bg,[9,25,21,25,18,29,12,29])},C.v),
kost:spr(48,40,x=>{const b='#cfc6b0',d='#6a6250';Pg(x,b,[42,16,48,8,46,18]);E(x,b,30,22,15,9);for(let i=0;i<4;i++)R(x,d,22+i*5,16,2,11);
  R(x,b,18,28,4,11);R(x,b,38,28,4,11);R(x,b,28,29,3,10);E(x,b,12,13,11,10);Pg(x,b,[2,18,22,18,20,29,4,29]);R(x,'#2a1c1c',4,21,16,4);
  for(let i=0;i<4;i++){R(x,'#fff',5+i*4,20,2,3);R(x,'#fff',6+i*4,24,2,2)}R(x,C.r,6,10,4,3);R(x,C.r,14,10,4,3)},'#3a3428'),
hunter:spr(36,50,x=>{const cl='#2c3a2c';Pg(x,cl,[18,0,28,8,30,22,34,50,2,50,6,22,8,8]);E(x,'#0c0f0c',18,13,7,8);E(x,'#cfc6b0',18,13,5,6);
  R(x,C.r,15,11,3,3);R(x,C.bg,20,12,2,2);R(x,'#1a241a',6,34,26,3);R(x,'#5a3e28',0,27,24,3);R(x,'#8a8a8a',2,22,2,13);R(x,'#cfc6b0',22,26,4,4)},'#0a0d0a'),
mrak:spr(48,48,x=>{Pg(x,'#1c1424',[24,0,36,4,46,14,48,28,42,42,30,48,18,48,6,42,0,28,2,14,12,4]);E(x,C.t,24,22,10,7);E(x,C.y,24,22,5,5);E(x,C.bg,24,22,2,4);
  for(const[a,b]of[[9,12],[38,10],[8,32],[40,34],[20,40],[31,39]]){E(x,C.t,a,b,3,2);R(x,C.r,a,b-1,1,2)}},C.v),
necro:spr(40,58,x=>{Pg(x,'#16201a',[20,8,30,14,34,58,6,58,10,14]);Pg(x,'#1e2c22',[20,0,30,8,30,21,10,21,10,8]);E(x,'#cfc6b0',20,12,6,7);
  R(x,C.g,16,10,3,3);R(x,C.g,22,10,3,3);R(x,C.bg,17,16,6,1);R(x,'#5a3e28',35,4,2,54);E(x,C.g,36,5,4,4);R(x,C.g,10,40,20,2);R(x,'#cfc6b0',31,26,5,3)},'#0a120c'),

function update(dt){P=new Set(pressQ);pressQ=[];if(take('mute'))toggleMute();toastT-=dt;musicTick();
